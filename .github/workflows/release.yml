name: Build and Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy

      - name: Build MoWAS2_Icon_Renderer.exe
        run: python build_exe.py

      - name: Package release zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/MoWAS2_Icon_Renderer.exe" -DestinationPath "dist/MoWAS2_Icon_Renderer-windows-x64.zip" -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MoWAS2_Icon_Renderer.exe
            dist/MoWAS2_Icon_Renderer-windows-x64.zip
          generate_release_notes: true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoWAS2_Icon_Renderer-windows-x64
          path: |
            dist/MoWAS2_Icon_Renderer.exe
            dist/MoWAS2_Icon_Renderer-windows-x64.zip
